id: gcp_setup
namespace: zoomcamp

variables:
  file: "yellow_tripdata_2019-01.csv"
  data: "{{ outputs.extract.outputFiles['yellow_tripdata_2019-01.csv'] }}"

tasks: 
  - id: set_project_id
    type: io.kestra.plugin.core.kv.Set
    key: GCP_PROJECT_ID
    kvType: STRING
    value: nytaxiproject-492423

  - id: set_location
    type: io.kestra.plugin.core.kv.Set
    key: GCP_LOCATION
    kvType: STRING
    value: us-central1

  - id: set_bucket_name
    type: io.kestra.plugin.core.kv.Set
    key: GCP_BUCKET_NAME
    kvType: STRING
    value: maddy-willett-kestra-bucket

  - id: set_dataset
    type: io.kestra.plugin.core.kv.Set
    key: GCP_DATASET
    kvType: STRING
    value: zoomcamp